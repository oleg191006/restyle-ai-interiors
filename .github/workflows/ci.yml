name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway Postgres: the build reads the database (generateStaticParams),
    # so CI seeds its own copy instead of touching production Neon.
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: restyle
          POSTGRES_PASSWORD: restyle
          POSTGRES_DB: restyle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restyle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # S3-compatible storage for the end-to-end test (R2 in production, ADR 0005).
      storage:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: restyle
        ports: ["9090:9090"]

    env:
      DATABASE_URL: postgresql://restyle:restyle@localhost:5432/restyle
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9090
      S3_BUCKET: restyle
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      # The QStash dev server's fixed credentials, published in Upstash's docs; not secrets.
      QSTASH_URL: http://127.0.0.1:8180
      QSTASH_TOKEN: eyJVc2VySUQiOiJkZWZhdWx0VXNlciIsIlBhc3N3b3JkIjoiZGVmYXVsdFBhc3N3b3JkIn0=
      QSTASH_CURRENT_SIGNING_KEY: sig_7kYjw48mhY7kAjqNGcy6cr29RJ6r
      QSTASH_NEXT_SIGNING_KEY: sig_5ZB6DVzB1wjE8S6rZ7eenA8Pdnhs
      AI_PROVIDER: fake
      RATE_LIMIT_SALT: ci
      BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate and seed
        run: |
          pnpm --filter @restyle/db exec prisma migrate deploy
          pnpm db:seed

      - run: pnpm lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm build

      # Real browser against the production build: upload → queue → worker → result.
      - name: End-to-end tests
        run: pnpm --filter web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Lighthouse CI
        run: pnpm lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
